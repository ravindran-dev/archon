[workspace]
resolver = "2"
members = [
    "crates/archon-types",
    "crates/archon-repo",
    "crates/archon-aur",
    "crates/archon-resolver",
    "crates/archon-sandbox",
    "crates/archon-monitor-common",
    "crates/archon-monitor",
    "crates/archon-distro",
    "crates/archon",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ravindran-dev/archon"

[workspace.dependencies]
# Internal crates. `version` alongside `path` is required for these to be
# publishable at all: a path-only dependency can never be published, since
# crates.io has no notion of "this repo's local checkout" for a downstream
# consumer to resolve against. With both present, local builds in this
# workspace use `path` (always preferred when available), while the
# manifest cargo actually uploads on `cargo publish` keeps only the
# `version` requirement, resolved against the crates.io copy — which is why
# every internal crate must be published in dependency order (types -> repo
# -> aur -> resolver -> sandbox -> monitor-common -> monitor -> archon-cli)
# before anything depending on it can be published itself.
archon-types = { path = "crates/archon-types", version = "0.2.0" }
archon-repo = { path = "crates/archon-repo", version = "0.2.0" }
archon-aur = { path = "crates/archon-aur", version = "0.2.0" }
archon-resolver = { path = "crates/archon-resolver", version = "0.2.0" }
archon-sandbox = { path = "crates/archon-sandbox", version = "0.2.0" }
archon-monitor-common = { path = "crates/archon-monitor-common", version = "0.2.0" }
archon-monitor = { path = "crates/archon-monitor", version = "0.2.0" }
archon-distro = { path = "crates/archon-distro", version = "0.2.0" }

# External
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
aya = "0.14"
aya-log = "0.3"
log = "0.4"
indicatif = "0.18"
libc = "0.2"
env_logger = "0.11"
tempfile = "3"
